plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "0.1.0"

// Google Maps SDK 키. 저장소에 커밋하지 않는다. 우선순위:
//   1) android/local.properties 의 MAPS_API_KEY  (로컬 개발 — 이 파일은 gitignore됨)
//   2) 환경변수 MAPS_API_KEY                      (CI)
// 둘 다 없으면 빈 값 — 지도가 회색으로 뜨지만 빌드 자체는 통과한다.
def mapsApiKey = localProperties.getProperty("MAPS_API_KEY") ?: System.getenv("MAPS_API_KEY") ?: ""

// 릴리즈 서명 설정. android/key.properties 는 gitignore돼 있으며 Play 업로드용
// 키스토어 정보를 담는다(key.properties.example 참고). 파일이 없으면 아래
// buildTypes.release 가 debug 서명으로 폴백한다 — 로컬 개발 편의를 위한 것이고,
// 그렇게 서명된 APK/AAB 는 Play 스토어에 업로드할 수 없다.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.gyeote.app"
    // [제품/툴체인 결정 2026-09-05] 34 -> 36. google_maps_flutter_android /
    // geolocator_android 등 여러 플러그인이 Flutter 3.47.1의 컴파일 기준인
    // FlutterExtension.compileSdkVersion(=36)으로 컴파일된다. AGP는 의존
    // 라이브러리보다 앱의 compileSdk가 낮으면 매니페스트 병합에서 하드 에러를
    // 낸다 — 34에서도 이미 "requires Android SDK version 36 or higher" 경고가
    // 떠 있었다. targetSdk는 34로 그대로 둔다(compileSdk만 올리는 게 정상).
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // [제품 결정 2026-09-05, 가인님 확정] applicationId는 com.gyeote.app로
        // 확정이며 이후 변경하지 않는다. 스토어 등록 후에는 변경 불가하고,
        // Google Maps API 키 제한(패키지명 기준)도 이 값에 걸려 있다.
        applicationId "com.gyeote.app"
        // [제품 결정 2026-09-03] 지원 최소 버전을 Android 7.0(API 24)로 올린다.
        // google_maps_flutter_android 2.19.13 이 minSdk 24 를 요구해서
        // (그 패키지 android/build.gradle.kts) API 23 으로 두면 매니페스트 머지
        // 단계에서 빌드가 깨진다. 지도가 v0.1 핵심 기능이라 우회 불가 →
        // Android 6.0(API 23) 기기는 지원 대상에서 제외. flutter.minSdkVersion 은
        // Flutter 3.47 기준 24 (flutter_tools gradle_utils.dart).
        minSdkVersion flutter.minSdkVersion
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // AndroidManifest.xml 의 com.google.android.geo.API_KEY 에 주입된다.
        manifestPlaceholders += [MAPS_API_KEY: mapsApiKey]
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("[곁에] key.properties 가 없어 release 빌드를 debug 키로 서명합니다. " +
                        "Play 스토어 업로드용 빌드에는 android/key.properties 를 설정하세요.")
                signingConfig signingConfigs.debug
            }
        }
    }
}

flutter {
    source "../.."
}
