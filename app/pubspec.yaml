name: gyeote
description: "곁에(Gyeote) - 장거리 커플/가족/친구를 위한 위치 공유 및 공동 편집 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Backend: Supabase (Auth / Postgres+PostGIS / Realtime).
  # 2.5.0 -> 2.8.0으로 상향: 위치 공유 실시간 채널이 Private 채널(Realtime
  # Authorization, `RealtimeChannelConfig(private: true)`)을 사용해야 하는데,
  # 이 기능은 supabase_flutter 2.5.0 시점에는 아직 없었다(대략 2.8.0 전후로
  # 추가됨). 가정(assumption): 실제 `flutter pub get` 실행 환경에서 버전 해석이
  # 실패하면(다른 패키지와 충돌 등) 가장 가까운 상위 버전으로 조정 필요.
  supabase_flutter: ^2.8.0

  # .env 파일로 SUPABASE_URL / SUPABASE_ANON_KEY 등 환경변수를 분리하기 위해 사용.
  flutter_dotenv: ^5.1.0

  # --- 위치 공유 기능 (이번 라운드 추가) -------------------------------------
  # 위치 스트림 구독 + 권한 상태 조회(geolocator 자체 권한 API도 있지만, "영구
  # 거부 후 설정 앱으로 유도" 플로우는 permission_handler가 더 다루기 쉬워 함께 사용).
  geolocator: ^12.0.0
  permission_handler: ^11.3.0

  # 지도 화면(상대 위치 마커 표시)에 사용.
  google_maps_flutter: ^2.9.0

  # 위치 핑 전송 시 배터리 잔량/충전 상태를 함께 보내기 위해 사용.
  battery_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # 런처 아이콘 생성기. `dart run flutter_launcher_icons` 로 android mipmap 세트
  # (+ adaptive XML) + iOS AppIcon 세트를 생성한다. 소스는 assets/icon/ 아래
  # Din 이 넣은 adaptive 세트(docs/design/v0.1-release-assets.md 1-3 스펙).
  flutter_launcher_icons: ^0.14.1

# 설정값은 docs/design/v0.1-release-assets.md 1-3 확정 스펙 기반.
# 로고 2B(2026-09-14, e2920d1) 반영 — 배경은 브랜드 시드 색 단색(#3B4272,
# 인디고), 전경/모노크롬은 투명 PNG. adaptive_icon_background 는 값(hex)과
# assets/icon/app_icon_background.png(단색 인디고) 둘 다 동일 결과라 값으로
# 둔다. iOS 는 알파 채널을 허용하지 않아 remove_alpha_ios 로 app_icon.png 의
# 투명 영역을 흰색으로 채운다(Din 스펙: app_icon.png 는 풀블리드 불투명).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#3B4272"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true

  assets:
    - .env
